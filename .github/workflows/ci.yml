name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-test-pack:
    name: Build, test, and pack
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Prism.Events.Extensions.slnx

      - name: Build
        run: dotnet build Prism.Events.Extensions.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test tests/Prism.Events.Extensions/Prism.Events.Extensions.Tests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/test-results

      - name: Create NuGet packages
        run: >-
          dotnet pack src/Prism.Events.Extensions/Prism.Events.Extensions.csproj
          --configuration Release
          --no-build
          --no-restore
          -p:VersionSuffix=ci.${{ github.run_number }}

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ github.run_number }}
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error
