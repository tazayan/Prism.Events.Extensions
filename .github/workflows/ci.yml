name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-test-pack:
    name: Build, test, and pack
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Prism.Events.Extensions.slnx

      - name: Build
        run: dotnet build Prism.Events.Extensions.slnx --configuration Release --no-restore

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          target_frameworks="$(dotnet msbuild tests/Prism.Events.Extensions/Prism.Events.Extensions.Tests.csproj -nologo -getProperty:TargetFrameworks)"
          IFS=';' read -ra frameworks <<< "$target_frameworks"
          for framework in "${frameworks[@]}"; do
            dotnet test \
              --project tests/Prism.Events.Extensions/Prism.Events.Extensions.Tests.csproj \
              --configuration Release \
              --framework "$framework" \
              --no-build \
              --results-directory "artifacts/test-results/$framework" \
              --coverage \
              --coverage-output coverage.cobertura.xml \
              --coverage-output-format cobertura \
              --coverage-settings tests/Prism.Events.Extensions/coverage.settings.xml
          done

      - name: Upload code coverage
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-coverage-${{ github.run_number }}
          path: artifacts/test-results/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Create NuGet packages
        run: >-
          dotnet pack src/Prism.Events.Extensions/Prism.Events.Extensions.csproj
          --configuration Release
          --no-build
          --no-restore
          -p:VersionSuffix=ci.${{ github.run_number }}

      - name: Upload NuGet packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages-${{ github.run_number }}
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error
